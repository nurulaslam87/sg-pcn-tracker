<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SG PCN Multi-Stop Nav</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: -apple-system, sans-serif; background: #f0f2f5; overflow: hidden; }
        #map { height: 100vh; width: 100vw; z-index: 1; }
        
        /* UI Panel */
        .ui-panel {
            position: absolute; top: 10px; left: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2); max-height: 40vh; overflow-y: auto;
        }
        .stop-list { margin-bottom: 10px; }
        .stop-item { 
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px; border-bottom: 1px solid #eee; font-size: 13px;
        }
        .leg-info { font-size: 11px; color: #666; background: #f9f9f9; padding: 4px 8px; border-radius: 4px; }

        .controls { display: flex; gap: 8px; margin-top: 10px; }
        button { flex-grow: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-add { background: #e8f5e9; color: #2e7d32; border: 1px solid #2e7d32; }
        .btn-nav { background: #1a73e8; color: white; }

        /* Floating Recenter Button */
        .recenter-btn {
            position: absolute; bottom: 30px; right: 20px; z-index: 1000;
            background: white; width: 50px; height: 50px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); border: none; font-size: 24px;
        }

        /* Nav Guide */
        #nav-guide {
            position: absolute; top: 0; left: 0; right: 0; z-index: 2000;
            background: #2e7d32; color: white; padding: 15px; text-align: center; display: none;
        }
    </style>
</head>
<body>

    <div id="nav-guide">
        <div id="instruction" style="font-weight:bold;">Navigating PCN Route...</div>
    </div>

    <div class="ui-panel" id="ui">
        <div id="stop-container" class="stop-list">
            <div class="stop-item"><strong>Start:</strong> (Drag Green Pin)</div>
        </div>
        <div class="controls">
            <button class="btn-add" onclick="addNewStop()">+ Add Stop</button>
            <button class="btn-nav" id="start-btn" style="display:none;" onclick="toggleNav()">START NAV</button>
        </div>
    </div>

    <button class="recenter-btn" onclick="recenterMap()">🎯</button>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const map = L.map('map', { zoomControl: false }).setView([1.3521, 103.8198], 12);
        let markers = []; // Array of all markers (Start + Ends)
        let routeLayer, gpsPos = null;
        let isNavigating = false;

        // 1. Permanent Map Tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // 2. PCN Overlay
        fetch('pcn.json').then(res => res.json()).then(data => {
            L.geoJSON(data, { style: { color: 'green', weight: 4, opacity: 0.3 }, interactive: false }).addTo(map);
        });

        // 3. Initialize Start & First Destination
        addMarker([1.3521, 103.8198], 'green', 'Start');
        addMarker([1.3621, 103.8298], 'red', 'Stop 1');

        // 4. GPS Tracking
        map.locate({watch: true, enableHighAccuracy: true});
        map.on('locationfound', e => {
            gpsPos = e.latlng;
            if (isNavigating) map.panTo(e.latlng);
        });

        function addMarker(latlng, color, label) {
            const marker = L.marker(latlng, {
                draggable: true,
                icon: L.divIcon({
                    html: `<div style="background:${color}; width:16px; height:16px; border:3px solid white; border-radius:50%; box-shadow:0 0 8px rgba(0,0,0,0.4);"></div>`,
                    iconSize: [20, 20], iconAnchor: [10, 10]
                })
            }).addTo(map);

            marker.on('dragend', calculateRoute);
            markers.push(marker);
            calculateRoute();
        }

        function addNewStop() {
            const lastPos = markers[markers.length - 1].getLatLng();
            const newPos = [lastPos.lat + 0.01, lastPos.lng + 0.01];
            addMarker(newPos, 'red', `Stop ${markers.length}`);
        }

        async function calculateRoute() {
            if (markers.length < 2) return;

            // Construct Multi-Stop OSRM URL
            const coords = markers.map(m => `${m.getLatLng().lng},${m.getLatLng().lat}`).join(';');
            const url = `https://router.project-osrm.org/route/v1/bicycle/${coords}?overview=full&geometries=polyline&steps=true`;

            try {
                const res = await fetch(url);
                const data = await res.json();
                const route = data.routes[0];

                // Draw Route
                if (routeLayer) map.removeLayer(routeLayer);
                const points = decodePolyline(route.geometry);
                routeLayer = L.polyline(points, {color: '#1a73e8', weight: 6}).addTo(map);
                
                // Update UI with Stats
                updateStats(route.legs);
                document.getElementById('start-btn').style.display = 'block';
            } catch (err) {
                console.log("Routing error");
            }
        }

        function updateStats(legs) {
            const container = document.getElementById('stop-container');
            container.innerHTML = `<div class="stop-item"><strong>🏁 Start Point</strong></div>`;
            
            legs.forEach((leg, index) => {
                const dist = (leg.distance / 1000).toFixed(2);
                const dur = Math.round(leg.duration / 60);
                
                const html = `
                    <div class="leg-info">⬇ ${dist} km | ~${dur} mins</div>
                    <div class="stop-item"><strong>📍 Stop ${index + 1}</strong></div>
                `;
                container.innerHTML += html;
            });
        }

        function recenterMap() {
            if (gpsPos) {
                map.setView(gpsPos, 17);
                const msg = new SpeechSynthesisUtterance("Recentering to your location");
                window.speechSynthesis.speak(msg);
            } else {
                alert("Searching for GPS...");
            }
        }

        function toggleNav() {
            isNavigating = !isNavigating;
            if (isNavigating) {
                document.getElementById('ui').style.display = 'none';
                document.getElementById('nav-guide').style.display = 'block';
                map.setView(gpsPos || markers[0].getLatLng(), 18);
            } else {
                document.getElementById('ui').style.display = 'block';
                document.getElementById('nav-guide').style.display = 'none';
            }
        }

        function decodePolyline(str) {
            let index = 0, lat = 0, lng = 0, coordinates = [], shift = 0, result = 0, byte = null;
            while (index < str.length) {
                shift = 0; result = 0;
                do { byte = str.charCodeAt(index++) - 63; result |= (byte & 0x1f) << shift; shift += 5; } while (byte >= 0x20);
                lat += ((result & 1) ? ~(result >> 1) : (result >> 1));
                shift = 0; result = 0;
                do { byte = str.charCodeAt(index++) - 63; result |= (byte & 0x1f) << shift; shift += 5; } while (byte >= 0x20);
                lng += ((result & 1) ? ~(result >> 1) : (result >> 1));
                coordinates.push([lat / 1e5, lng / 1e5]);
            }
            return coordinates;
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SG PCN Navigator</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #map { height: 100vh; width: 100vw; z-index: 1; }
        .search-wrapper {
            position: absolute; top: 10px; left: 10px; right: 10px; z-index: 1000;
            background: white; padding: 10px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .search-group { display: flex; gap: 8px; }
        input { flex-grow: 1; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
        button { padding: 12px; background: #2e7d32; color: white; border: none; border-radius: 8px; font-weight: bold; }
        #results { background: white; max-height: 200px; overflow-y: auto; margin-top: 5px; border-radius: 8px; display: none; }
        .result-item { padding: 12px; border-bottom: 1px solid #eee; font-size: 14px; cursor: pointer; }
        #status {
            position: absolute; bottom: 80px; left: 10px; right: 10px; z-index: 1000;
            background: rgba(0,0,0,0.8); color: white; padding: 10px; border-radius: 8px; font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="search-wrapper">
        <div class="search-group">
            <input type="text" id="addressInput" placeholder="Enter destination...">
            <button onclick="searchAddress()">Search</button>
        </div>
        <div id="results"></div>
    </div>

    <div id="status">Waiting for GPS lock...</div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // YOUR TOKEN
        const ONEMAP_TOKEN = "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyX2lkIjoxNjAyMSwiZm9yZXZlciI6ZmFsc2UsImlzcyI6Ik9uZU1hcCIsImlhdCI6MTc4MTA1MTIwOSwibmJmIjoxNzgxMDUxMjA5LCJleHAiOjE3ODEzMTA0MDksImp0aSI6IjczYTIyMWI5LTIzOTQtNDZmMC05ZTZlLTJlODdkYWYxMjYxMSJ9.HJ2e-AlroVaW3uEOoZmfHSikY5vPx2GxKNqhR78Z80-N58q8gFnboCynq3G4CP9sWZSfwsJYRWD9kYdu1huJKQpoxhJd5kdxBVXOsEhvXGKvMIges333QSYAibHJ3JD1VEV1OcWpQBWgaJtAtgEQcLziPIl9EXwzpR5GWMXhTQxpQSyJP_w6UC-Mlvu_p_HpSymwBZcVrYzKP5hl1ZdHIlimz2X_clkqWRbKjtdNsFAsAJIQ-RER9mMOIJZsSa-BtA1NEZdOP0Iay-1P7qJhqJbTAljTWSTckf_qbSKArhKdWH68fwU97Dd_AQ7FPz3ChdfoXwR7W3xr7XlVCeAdng";

        const map = L.map('map', { zoomControl: false }).setView([1.3521, 103.8198], 12);
        let userLocation = null;
        let userMarker, routeLayer;

        L.tileLayer('https://www.onemap.gov.sg/maps/tiles/Default/{z}/{x}/{y}.png', {
            maxZoom: 19, attribution: 'OneMap'
        }).addTo(map);

        // Load PCN overlay
        fetch('pcn.json').then(res => res.json()).then(data => {
            L.geoJSON(data, { style: { color: 'green', weight: 3, opacity: 0.5 } }).addTo(map);
        }).catch(e => console.log("PCN lines loading..."));

        // GPS Tracking
        map.locate({setView: true, maxZoom: 16, watch: true, enableHighAccuracy: true});
        map.on('locationfound', e => {
            userLocation = e.latlng;
            if (!userMarker) {
                userMarker = L.marker(e.latlng).addTo(map).bindPopup("You");
            } else {
                userMarker.setLatLng(e.latlng);
            }
            document.getElementById('status').innerText = "GPS Fixed. Ready to route.";
        });

        async function searchAddress() {
            const query = document.getElementById('addressInput').value;
            try {
                const res = await fetch(`https://www.onemap.gov.sg/api/common/elastic/search?searchVal=${query}&returnGeom=Y&getAddrDetails=Y`, {
                    headers: { 'Authorization': ONEMAP_TOKEN }
                });
                const data = await res.json();
                const resultsDiv = document.getElementById('results');
                resultsDiv.innerHTML = '';
                resultsDiv.style.display = 'block';

                if (data.results.length === 0) {
                    resultsDiv.innerHTML = '<div class="result-item">No results found. Check your token.</div>';
                    return;
                }

                data.results.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'result-item';
                    div.innerHTML = item.ADDRESS;
                    div.onclick = () => selectDestination(item.LATITUDE, item.LONGITUDE, item.ADDRESS);
                    resultsDiv.appendChild(div);
                });
            } catch (err) {
                document.getElementById('status').innerText = "Search Error: Likely expired token.";
            }
        }

        async function selectDestination(lat, lng, name) {
            document.getElementById('results').style.display = 'none';
            if (!userLocation) {
                alert("GPS not fixed yet. Walk to a window or step outside.");
                return;
            }

            document.getElementById('status').innerText = "Calculating PCN route...";

            const start = `${userLocation.lat},${userLocation.lng}`;
            const end = `${lat},${lng}`;
            const url = `https://www.onemap.gov.sg/api/public/routing/route?start=${start}&end=${end}&routeType=cycle`;

            try {
                const response = await fetch(url, { headers: { 'Authorization': ONEMAP_TOKEN } });
                const routeData = await response.json();

                // Detailed Error Checking
                if (routeData.error || !routeData.route_geometry) {
                    document.getElementById('status').innerText = "Error: " + (routeData.error || "No cycling path found between these points.");
                    return;
                }

                if (routeLayer) map.removeLayer(routeLayer);
                const points = decodePolyline(routeData.route_geometry);
                routeLayer = L.polyline(points, {color: 'blue', weight: 6}).addTo(map);
                map.fitBounds(routeLayer.getBounds());
                document.getElementById('status').innerText = "Route found to " + name;
            } catch (err) {
                document.getElementById('status').innerText = "Connection error or expired OneMap token.";
            }
        }

        function decodePolyline(str) {
            let index = 0, lat = 0, lng = 0, coordinates = [], shift = 0, result = 0, byte = null;
            while (index < str.length) {
                shift = 0; result = 0;
                do { byte = str.charCodeAt(index++) - 63; result |= (byte & 0x1f) << shift; shift += 5; } while (byte >= 0x20);
                lat += ((result & 1) ? ~(result >> 1) : (result >> 1));
                shift = 0; result = 0;
                do { byte = str.charCodeAt(index++) - 63; result |= (byte & 0x1f) << shift; shift += 5; } while (byte >= 0x20);
                lng += ((result & 1) ? ~(result >> 1) : (result >> 1));
                coordinates.push([lat / 1e5, lng / 1e5]);
            }
            return coordinates;
        }
    </script>
</body>
</html>

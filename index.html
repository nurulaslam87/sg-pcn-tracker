<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SG PCN Safety Navigator</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: -apple-system, sans-serif; background: #f0f2f5; overflow: hidden; }
        #map { height: 100vh; width: 100vw; z-index: 1; }
        
        /* UI Panel */
        .ui-panel {
            position: absolute; top: 10px; left: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 16px;
            box-shadow: 0 4px 25px rgba(0,0,0,0.2); max-height: 45vh; overflow-y: auto;
        }

        .stop-row { background: #f8f9fa; margin-bottom: 8px; padding: 10px; border-radius: 10px; border-left: 5px solid #2e7d32; }
        .stop-row.end { border-left-color: #d32f2f; }
        
        .input-group { display: flex; gap: 5px; }
        input { flex-grow: 1; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; }
        .btn-action { padding: 10px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 12px; }

        /* Navigation HUD */
        #nav-hud {
            position: absolute; top: 0; left: 0; right: 0; z-index: 2000;
            background: #1b5e20; color: white; padding: 20px; display: none;
            text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        #nav-direction { font-size: 40px; font-weight: bold; margin-bottom: 5px; }
        #nav-text { font-size: 18px; font-weight: 600; }

        .stats { font-size: 12px; color: #2e7d32; margin-top: 5px; font-weight: bold; }
        .main-btns { display: flex; gap: 10px; margin-top: 10px; }
        .btn-main { flex-grow: 1; padding: 15px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; color: white; }

        #search-results {
            position: fixed; top: 70px; left: 20px; right: 20px; z-index: 3000;
            background: white; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: none; max-height: 300px; overflow-y: auto;
        }
        .res-item { padding: 15px; border-bottom: 1px solid #eee; cursor: pointer; }
        
        .recenter-btn {
            position: absolute; bottom: 30px; right: 20px; z-index: 1000;
            background: white; width: 55px; height: 55px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); border: none; font-size: 24px;
        }
    </style>
</head>
<body>

    <div id="search-results"></div>

    <div id="nav-hud">
        <div id="nav-direction">↑</div>
        <div id="nav-text">Starting Navigation...</div>
        <button onclick="stopNav()" style="position:absolute; top:10px; right:10px; background:rgba(255,255,255,0.2); border:none; color:white; border-radius:5px; padding:5px;">Exit</button>
    </div>

    <div class="ui-panel" id="ui">
        <div id="stop-list"></div>
        <div class="main-btns">
            <button class="btn-main" style="background:#4caf50;" onclick="addStopUI()">+ Add Stop</button>
            <button class="btn-main" id="go-btn" style="background:#1a73e8; display:none;" onclick="startNav()">START NAVIGATION</button>
        </div>
    </div>

    <button class="recenter-btn" onclick="recenterMap()">🎯</button>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Use a fresh OneMap Token (Essential for Expressway-free routing)
        const ONEMAP_TOKEN = "YOUR_TOKEN_HERE"; 

        const map = L.map('map', { zoomControl: false }).setView([1.3521, 103.8198], 12);
        let stops = [], routeLayer, gpsPos = null, isNavigating = false;

        L.tileLayer('https://www.onemap.gov.sg/maps/tiles/Default/{z}/{x}/{y}.png').addTo(map);

        // Official PCN Overlay
        fetch('pcn.json').then(res => res.json()).then(data => {
            L.geoJSON(data, { style: { color: '#2e7d32', weight: 4, opacity: 0.4 }, interactive: false }).addTo(map);
        });

        map.locate({watch: true, enableHighAccuracy: true});
        map.on('locationfound', e => {
            gpsPos = e.latlng;
            if (isNavigating) {
                map.panTo(e.latlng);
                processNav(e.latlng);
            }
        });

        // Initialize with 2 points
        addStopUI('Start', [1.3521, 103.8198], 'green');
        addStopUI('End', [1.3621, 103.8298], 'red');

        function addStopUI(label, latlng, color) {
            const idx = stops.length;
            if (!latlng) {
                const prev = stops[idx-1].marker.getLatLng();
                latlng = [prev.lat + 0.005, prev.lng + 0.005];
            }
            const marker = L.marker(latlng, {
                draggable: true,
                icon: L.divIcon({
                    html: `<div style="background:${color}; width:18px; height:18px; border:3px solid white; border-radius:50%; box-shadow:0 0 5px rgba(0,0,0,0.5);"></div>`,
                    iconSize: [20, 20], iconAnchor: [10, 10]
                })
            }).addTo(map);

            marker.on('dragend', calculateSafeRoute);

            const row = document.createElement('div');
            row.className = `stop-row ${color === 'red' ? 'end' : ''}`;
            row.innerHTML = `
                <div class="input-group">
                    <input type="text" id="in-${idx}" placeholder="Search location...">
                    <button class="btn-action" style="background:#e3f2fd;" onclick="setGPS(${idx})">GPS</button>
                    <button class="btn-action" style="background:#2e7d32; color:white;" onclick="doSearch(${idx})">🔍</button>
                </div>
                <div id="stat-${idx}" class="stats"></div>
            `;
            document.getElementById('stop-list').appendChild(row);
            stops.push({ marker });
            calculateSafeRoute();
        }

        async function calculateSafeRoute() {
            if (stops.length < 2) return;
            const s = stops[0].marker.getLatLng();
            const e = stops[stops.length-1].marker.getLatLng();

            // routeType=cycle specifically avoids Expressways, Tunnels, and prioritizes PCN
            const url = `https://www.onemap.gov.sg/api/public/routingsvc/route?start=${s.lat},${s.lng}&end=${e.lat},${e.lng}&routeType=cycle`;

            try {
                const res = await fetch(url, { headers: { 'Authorization': ONEMAP_TOKEN } });
                const data = await res.json();
                
                if (routeLayer) map.removeLayer(routeLayer);
                const points = decodePolyline(data.route_geometry);
                routeLayer = L.polyline(points, {color: '#1a73e8', weight: 6, opacity: 0.9}).addTo(map);
                map.fitBounds(routeLayer.getBounds(), {padding: [50, 50]});
                
                document.getElementById('go-btn').style.display = 'block';
                document.getElementById('stat-1').innerText = `PCN Route: ${data.route_summary.total_distance}m | ~${data.route_summary.total_time} mins`;
            } catch (err) { console.error("Route failed. Ensure you have a valid OneMap Token."); }
        }

        function startNav() {
            isNavigating = true;
            document.getElementById('ui').style.display = 'none';
            document.getElementById('nav-hud').style.display = 'block';
            speak("Safety navigation active. Avoiding all expressways.");
            map.setZoom(18);
        }

        function stopNav() {
            isNavigating = false;
            document.getElementById('ui').style.display = 'block';
            document.getElementById('nav-hud').style.display = 'none';
        }

        function processNav(pos) {
            // Logic to check distance to next coordinate and trigger voice
            // Arrow calculation based on bearing...
        }

        function speak(t) { window.speechSynthesis.speak(new SpeechSynthesisUtterance(t)); }

        async function doSearch(idx) {
            const q = document.getElementById(`in-${idx}`).value;
            const res = await fetch(`https://www.onemap.gov.sg/api/common/elastic/search?searchVal=${q}&returnGeom=Y&getAddrDetails=N`);
            const data = await res.json();
            const results = document.getElementById('search-results');
            results.innerHTML = ''; results.style.display = 'block';
            data.results.forEach(item => {
                const div = document.createElement('div');
                div.className = 'res-item'; div.innerText = item.ADDRESS;
                div.onclick = () => {
                    stops[idx].marker.setLatLng([item.LATITUDE, item.LONGITUDE]);
                    document.getElementById(`in-${idx}`).value = item.SEARCHVAL;
                    results.style.display = 'none'; calculateSafeRoute();
                };
                results.appendChild(div);
            });
        }

        function setGPS(idx) { if (gpsPos) { stops[idx].marker.setLatLng(gpsPos); calculateSafeRoute(); } }
        function recenterMap() { if (gpsPos) map.panTo(gpsPos); }

        function decodePolyline(str) {
            let index = 0, lat = 0, lng = 0, coordinates = [], shift = 0, result = 0, byte = null;
            while (index < str.length) {
                shift = 0; result = 0;
                do { byte = str.charCodeAt(index++) - 63; result |= (byte & 0x1f) << shift; shift += 5; } while (byte >= 0x20);
                lat += ((result & 1) ? ~(result >> 1) : (result >> 1));
                shift = 0; result = 0;
                do { byte = str.charCodeAt(index++) - 63; result |= (byte & 0x1f) << shift; shift += 5; } while (byte >= 0x20);
                lng += ((result & 1) ? ~(result >> 1) : (result >> 1));
                coordinates.push([lat / 1e5, lng / 1e5]);
            }
            return coordinates;
        }
    </script>
</body>
</html>

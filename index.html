<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SG PCN Live Navigator</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: -apple-system, sans-serif; overflow: hidden; background: #f0f2f5; }
        #map { height: 100vh; width: 100vw; z-index: 1; }
        
        /* Planning Panel */
        .planning-panel {
            position: absolute; top: 10px; left: 10px; right: 10px; z-index: 1000;
            background: white; padding: 12px; border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2); display: flex; flex-direction: column; gap: 8px;
        }
        .input-group { display: flex; align-items: center; gap: 8px; }
        input { flex-grow: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
        .btn-gps { background: #e3f2fd; color: #1976d2; border: 1px solid #bbdefb; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-search { background: #2e7d32; color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; }

        /* Navigation Overlay (Hidden until Start) */
        #nav-guide {
            position: absolute; top: 0; left: 0; right: 0; z-index: 2000;
            background: #2e7d32; color: white; padding: 20px; text-align: center;
            display: none; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        #nav-instruction { font-size: 20px; font-weight: bold; }

        /* Start Button */
        #start-nav-btn {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            z-index: 1000; background: #1a73e8; color: white; border: none;
            padding: 15px 40px; border-radius: 30px; font-size: 18px; font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4); display: none; cursor: pointer;
        }

        .marker-label { font-weight: bold; font-size: 12px; }
        #search-results { background: white; max-height: 150px; overflow-y: auto; border-radius: 8px; display: none; border: 1px solid #eee; }
        .result-item { padding: 10px; border-bottom: 1px solid #eee; font-size: 13px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- Planning UI -->
    <div class="planning-panel" id="ui-panel">
        <div class="input-group">
            <div style="color:green">●</div>
            <input type="text" id="startInput" placeholder="Start Point">
            <button class="btn-gps" onclick="setGPS('start')">GPS</button>
            <button class="btn-search" onclick="search('start')">🔍</button>
        </div>
        <div class="input-group">
            <div style="color:red">●</div>
            <input type="text" id="endInput" placeholder="End Point">
            <button class="btn-gps" onclick="setGPS('end')">GPS</button>
            <button class="btn-search" onclick="search('end')">🔍</button>
        </div>
        <div id="search-results"></div>
    </div>

    <!-- Active Navigation UI -->
    <div id="nav-guide">
        <div id="nav-instruction">Follow the Blue Route</div>
        <div style="font-size: 40px;" id="nav-arrow">↑</div>
    </div>

    <button id="start-nav-btn" onclick="activateLiveNav()">START NAVIGATION</button>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const ONEMAP_TOKEN = "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyX2lkIjoxNjAyMSwiZm9yZXZlciI6ZmFsc2UsImlzcyI6Ik9uZU1hcCIsImlhdCI6MTc4MTA1MTIwOSwibmJmIjoxNzgxMDUxMjA5LCJleHAiOjE3ODEzMTA0MDksImp0aSI6IjczYTIyMWI5LTIzOTQtNDZmMC05ZTZlLTJlODdkYWYxMjYxMSJ9.HJ2e-AlroVaW3uEOoZmfHSikY5vPx2GxKNqhR78Z80-N58q8gFnboCynq3G4CP9sWZSfwsJYRWD9kYdu1huJKQpoxhJd5kdxBVXOsEhvXGKvMIges333QSYAibHJ3JD1VEV1OcWpQBWgaJtAtgEQcLziPIl9EXwzpR5GWMXhTQxpQSyJP_w6UC-Mlvu_p_HpSymwBZcVrYzKP5hl1ZdHIlimz2X_clkqWRbKjtdNsFAsAJIQ-RER9mMOIJZsSa-BtA1NEZdOP0Iay-1P7qJhqJbTAljTWSTckf_qbSKArhKdWH68fwU97Dd_AQ7FPz3ChdfoXwR7W3xr7XlVCeAdng";

        const map = L.map('map', { zoomControl: false }).setView([1.3521, 103.8198], 12);
        let startMarker, endMarker, routeLayer, gpsPos = null;
        let isNavigating = false;

        L.tileLayer('https://www.onemap.gov.sg/maps/tiles/Default/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

        // Load PCN Visual Layer
        fetch('pcn.json').then(res => res.json()).then(data => {
            L.geoJSON(data, { style: { color: 'green', weight: 3, opacity: 0.4 } }).addTo(map);
        });

        // Initialize Markers (Draggable)
        startMarker = L.marker([1.3521, 103.8198], { draggable: true, icon: createIcon('green') }).addTo(map);
        endMarker = L.marker([1.3621, 103.8198], { draggable: true, icon: createIcon('red') }).addTo(map);

        [startMarker, endMarker].forEach(m => m.on('dragend', () => calculateRoute()));

        // Continuous GPS Tracking
        map.locate({watch: true, enableHighAccuracy: true});
        map.on('locationfound', e => { 
            gpsPos = e.latlng;
            if (isNavigating) {
                map.panTo(e.latlng);
                checkProximity(e.latlng);
            }
        });

        function setGPS(type) {
            if (!gpsPos) return alert("Waiting for GPS...");
            const marker = (type === 'start') ? startMarker : endMarker;
            marker.setLatLng(gpsPos);
            calculateRoute();
        }

        async function search(type) {
            const query = document.getElementById(type + 'Input').value;
            const res = await fetch(`https://www.onemap.gov.sg/api/common/elastic/search?searchVal=${query}&returnGeom=Y&getAddrDetails=Y`);
            const data = await res.json();
            const resultsDiv = document.getElementById('search-results');
            resultsDiv.innerHTML = '';
            resultsDiv.style.display = 'block';

            data.results.forEach(item => {
                const div = document.createElement('div');
                div.className = 'result-item';
                div.innerHTML = item.ADDRESS;
                div.onclick = () => {
                    const latlng = [item.LATITUDE, item.LONGITUDE];
                    const marker = (type === 'start') ? startMarker : endMarker;
                    marker.setLatLng(latlng);
                    document.getElementById(type + 'Input').value = item.ADDRESS;
                    resultsDiv.style.display = 'none';
                    map.setView(latlng, 15);
                    calculateRoute();
                };
                resultsDiv.appendChild(div);
            });
        }

        async function calculateRoute() {
            const s = startMarker.getLatLng();
            const e = endMarker.getLatLng();
            const url = `https://www.onemap.gov.sg/api/public/routingsvc/route?start=${s.lat},${s.lng}&end=${e.lat},${e.lng}&routeType=cycle`;

            try {
                const res = await fetch(url, { headers: { 'Authorization': ONEMAP_TOKEN } });
                const data = await res.json();
                if (routeLayer) map.removeLayer(routeLayer);
                
                const points = decodePolyline(data.route_geometry);
                routeLayer = L.polyline(points, {color: '#1a73e8', weight: 6}).addTo(map);
                map.fitBounds(routeLayer.getBounds(), {padding: [50, 50]});
                
                document.getElementById('start-nav-btn').style.display = 'block';
            } catch (err) {
                console.log("Routing error - try moving pins to a road.");
            }
        }

        function activateLiveNav() {
            isNavigating = true;
            document.getElementById('ui-panel').style.display = 'none';
            document.getElementById('start-nav-btn').style.display = 'none';
            document.getElementById('nav-guide').style.display = 'block';
            speak("Navigation starting. Follow the blue route.");
            map.setZoom(18);
        }

        function checkProximity(currentLatLng) {
            // Placeholder for turn-by-turn logic
            // In a full implementation, you'd calculate distance to next geometry node
        }

        function speak(text) {
            const msg = new SpeechSynthesisUtterance(text);
            window.speechSynthesis.speak(msg);
        }

        function createIcon(color) {
            return L.divIcon({
                html: `<div style="background:${color}; width:15px; height:15px; border:3px solid white; border-radius:50%; box-shadow: 0 0 5px rgba(0,0,0,0.5);"></div>`,
                iconSize: [20, 20], iconAnchor: [10, 10]
            });
        }

        function decodePolyline(str) {
            let index = 0, lat = 0, lng = 0, coordinates = [], shift = 0, result = 0, byte = null;
            while (index < str.length) {
                shift = 0; result = 0;
                do { byte = str.charCodeAt(index++) - 63; result |= (byte & 0x1f) << shift; shift += 5; } while (byte >= 0x20);
                lat += ((result & 1) ? ~(result >> 1) : (result >> 1));
                shift = 0; result = 0;
                do { byte = str.charCodeAt(index++) - 63; result |= (byte & 0x1f) << shift; shift += 5; } while (byte >= 0x20);
                lng += ((result & 1) ? ~(result >> 1) : (result >> 1));
                coordinates.push([lat / 1e5, lng / 1e5]);
            }
            return coordinates;
        }
    </script>
</body>
</html>

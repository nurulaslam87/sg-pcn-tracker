<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SG Live PCN Navigator</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: -apple-system, sans-serif; overflow: hidden; }
        #map { height: 100vh; width: 100vw; }
        
        /* Navigation Guidance Overlay */
        #nav-guide {
            position: absolute; top: 10px; left: 10px; right: 10px; z-index: 2000;
            background: white; padding: 15px; border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3); display: none;
            align-items: center; gap: 15px;
        }
        #nav-arrow { font-size: 40px; color: #2e7d32; font-weight: bold; }
        #nav-text { flex-grow: 1; font-weight: 600; font-size: 16px; }

        .search-area {
            position: absolute; bottom: 30px; left: 10px; right: 10px; z-index: 1000;
            background: white; padding: 10px; border-radius: 12px; display: flex; gap: 5px;
        }
        input { flex-grow: 1; padding: 12px; border: 1px solid #ddd; border-radius: 8px; }
        button { padding: 12px; background: #2e7d32; color: white; border: none; border-radius: 8px; font-weight: bold; }
        
        /* Directional Marker */
        .user-icon { font-size: 24px; transition: transform 0.2s; }
    </style>
</head>
<body>

    <div id="nav-guide">
        <div id="nav-arrow">↑</div>
        <div id="nav-text">Head towards the PCN to start...</div>
    </div>

    <div id="map"></div>

    <div class="search-area">
        <input type="text" id="dest" placeholder="Enter Destination...">
        <button onclick="startNav()">Navigate</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const ONEMAP_TOKEN = "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyX2lkIjoxNjAyMSwiZm9yZXZlciI6ZmFsc2UsImlzcyI6Ik9uZU1hcCIsImlhdCI6MTc4MTA1MTIwOSwibmJmIjoxNzgxMDUxMjA5LCJleHAiOjE3ODEzMTA0MDksImp0aSI6IjczYTIyMWI5LTIzOTQtNDZmMC05ZTZlLTJlODdkYWYxMjYxMSJ9.HJ2e-AlroVaW3uEOoZmfHSikY5vPx2GxKNqhR78Z80-N58q8gFnboCynq3G4CP9sWZSfwsJYRWD9kYdu1huJKQpoxhJd5kdxBVXOsEhvXGKvMIges333QSYAibHJ3JD1VEV1OcWpQBWgaJtAtgEQcLziPIl9EXwzpR5GWMXhTQxpQSyJP_w6UC-Mlvu_p_HpSymwBZcVrYzKP5hl1ZdHIlimz2X_clkqWRbKjtdNsFAsAJIQ-RER9mMOIJZsSa-BtA1NEZdOP0Iay-1P7qJhqJbTAljTWSTckf_qbSKArhKdWH68fwU97Dd_AQ7FPz3ChdfoXwR7W3xr7XlVCeAdng";

        const map = L.map('map', { zoomControl: false }).setView([1.3521, 103.8198], 13);
        let userPos = null;
        let userMarker, routeLayer, navSteps = [];
        let currentStepIndex = 0;

        L.tileLayer('https://www.onemap.gov.sg/maps/tiles/Default/{z}/{x}/{y}.png').addTo(map);

        // Load PCN overlay
        fetch('pcn.json').then(res => res.json()).then(data => {
            L.geoJSON(data, { style: { color: 'green', weight: 3, opacity: 0.3 } }).addTo(map);
        });

        // Initialize GPS
        map.locate({watch: true, enableHighAccuracy: true});
        map.on('locationfound', (e) => {
            userPos = e.latlng;
            updateUserMarker(e);
            checkNavigation(e.latlng);
        });

        function updateUserMarker(e) {
            if (!userMarker) {
                const icon = L.divIcon({ className: 'user-icon', html: '🚲', iconSize: [30, 30] });
                userMarker = L.marker(e.latlng, { icon }).addTo(map);
            } else {
                userMarker.setLatLng(e.latlng);
            }
            map.panTo(e.latlng); // Active tracking: Keep map on user
        }

        async function startNav() {
            const query = document.getElementById('dest').value;
            // 1. Get Destination Coords
            const searchRes = await fetch(`https://www.onemap.gov.sg/api/common/elastic/search?searchVal=${query}&returnGeom=Y&getAddrDetails=N`);
            const searchData = await searchRes.json();
            if (!searchData.results.length) return alert("Destination not found");
            const dest = searchData.results[0];

            // 2. Get Route with Instructions
            const url = `https://www.onemap.gov.sg/api/public/routingsvc/route?start=${userPos.lat},${userPos.lng}&end=${dest.LATITUDE},${dest.LONGITUDE}&routeType=cycle`;
            const routeRes = await fetch(url, { headers: { 'Authorization': ONEMAP_TOKEN } });
            const routeData = await routeRes.json();

            // 3. Setup Navigation
            if (routeLayer) map.removeLayer(routeLayer);
            const points = decodePolyline(routeData.route_geometry);
            routeLayer = L.polyline(points, { color: 'blue', weight: 6 }).addTo(map);
            
            navSteps = routeData.route_instructions || []; // Note: OneMap sometimes includes text instructions
            currentStepIndex = 0;
            document.getElementById('nav-guide').style.display = 'flex';
            speak("Navigation started. Follow the blue line.");
        }

        function checkNavigation(currentPos) {
            if (!routeLayer || navSteps.length === 0) return;

            // Simple proximity check for next maneuver
            // In a production app, you would use a 'cross-track error' calculation
            // Here, we check the distance to the next point in the geometry
            const points = routeLayer.getLatLngs();
            const nextPoint = points[currentStepIndex + 5]; // Check a few points ahead

            if (nextPoint) {
                const dist = currentPos.distanceTo(nextPoint);
                if (dist < 30) {
                    currentStepIndex += 5; // Move progress forward
                    updateNavUI("Continue straight on PCN", "↑");
                }
            }
        }

        function updateNavUI(text, arrow) {
            document.getElementById('nav-text').innerText = text;
            document.getElementById('nav-arrow').innerText = arrow;
            speak(text);
        }

        function speak(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 1.0;
            window.speechSynthesis.speak(utterance);
        }

        function decodePolyline(str) {
            let index = 0, lat = 0, lng = 0, coordinates = [], shift = 0, result = 0, byte = null;
            while (index < str.length) {
                shift = 0; result = 0;
                do { byte = str.charCodeAt(index++) - 63; result |= (byte & 0x1f) << shift; shift += 5; } while (byte >= 0x20);
                lat += ((result & 1) ? ~(result >> 1) : (result >> 1));
                shift = 0; result = 0;
                do { byte = str.charCodeAt(index++) - 63; result |= (byte & 0x1f) << shift; shift += 5; } while (byte >= 0x20);
                lng += ((result & 1) ? ~(result >> 1) : (result >> 1));
                coordinates.push([lat / 1e5, lng / 1e5]);
            }
            return coordinates;
        }
    </script>
</body>
</html>
